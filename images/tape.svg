<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 110" width="400" height="110" role="img" aria-label="Strip of masking tape" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ddd0a0"/>
      <stop offset=".45" stop-color="#e9dfb8"/>
      <stop offset="1" stop-color="#d6c892"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".0"/>
      <stop offset=".3" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".85" stop-color="#fff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-5%" y="-10%" width="110%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope=".25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- tape body with torn zig-zag ends -->
  <path id="shape" filter="url(#soft)" fill="url(#body)" fill-opacity=".93"
    d="M12 10 L388 8 L384 16 L390 24 L385 32 L391 41 L386 50 L390 59 L385 68 L391 77 L386 86 L388 98
       L14 100 L18 91 L11 82 L17 73 L10 64 L16 55 L10 46 L17 37 L11 28 L16 19 Z"/>
  <!-- highlights and creases -->
  <rect x="14" y="12" width="372" height="84" fill="url(#sheen)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M60 14 C90 40 110 30 150 52 S210 70 240 92" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>
    <path d="M62 16 C92 43 112 33 152 55 S212 73 242 94" stroke="#a89a62" stroke-opacity=".28" stroke-width="1.2"/>
    <path d="M250 12 C270 30 300 34 330 60 S362 82 372 94" stroke="#fff" stroke-opacity=".4" stroke-width="1.6"/>
    <path d="M252 14 C272 33 302 37 332 63 S364 85 374 96" stroke="#a89a62" stroke-opacity=".22" stroke-width="1"/>
    <path d="M30 60 C70 55 100 66 130 58" stroke="#a89a62" stroke-opacity=".18" stroke-width="1"/>
  </g>
</svg>
